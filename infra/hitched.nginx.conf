# Place this file at /etc/nginx/sites-available/hitched
# then: sudo ln -s /etc/nginx/sites-available/hitched /etc/nginx/sites-enabled/hitched
# and:  sudo nginx -t && sudo systemctl reload nginx
#
# TLS certificates are assumed to already be in place (e.g. via certbot).
# Run: sudo certbot --nginx -d your.domain.com  to provision them if not.

server {
    listen 80;
    server_name reception.npmaile.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name reception.npmaile.com;

    ssl_certificate     /etc/letsencrypt/live/reception.npmaile.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reception.npmaile.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
